<html lang="en">

<head>
  <meta charset="UTF-8" />

  <title id="t">Home</title>

  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --mongle: #00ff41;
      --mongle-dim: rgba(0, 255, 65, 0.45);
      --mongle-faint: rgba(0, 255, 65, 0.18);
      --panel: #0d0d0d;
      --panel-border: #223322;
      --placeholder: #4a5d4a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: #000 !important;
      background-image: none !important;
      color: var(--mongle) !important;
      font-family: "VT323", "Share Tech Mono", "Courier New", monospace;
      overflow: hidden;
    }

    /* injected navbar lives here - hidden on the terminal home screen */
    .f-nav {
      display: none !important;
    }

    /* subtle CRT scanlines */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 255, 65, 0.025) 3px,
        rgba(0, 0, 0, 0) 4px
      );
    }

    #particles-js {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #particles-js canvas {
      display: block;
    }

    .main {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      animation: boot 0.6s ease-out;
    }

    @keyframes boot {
      from {
        opacity: 0;
        filter: brightness(2.5);
      }
      to {
        opacity: 1;
        filter: brightness(1);
      }
    }

    .title {
      font-size: clamp(44px, 8vw, 84px);
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--mongle) !important;
      text-shadow:
        0 0 6px rgba(0, 255, 65, 0.9),
        0 0 20px rgba(0, 255, 65, 0.55),
        0 0 48px rgba(0, 255, 65, 0.35) !important;
      white-space: nowrap;
      user-select: none;
    }

    .cursor {
      display: inline-block;
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .subtitle {
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      color: var(--mongle-dim) !important;
      text-transform: uppercase;
      user-select: none;
      margin-bottom: 26px;
    }

    .search-container {
      width: min(640px, 92vw);
    }

    #fv {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    #input {
      flex: 1;
      min-width: 0;
      background: var(--panel) !important;
      border: 1px solid var(--panel-border) !important;
      border-radius: 8px;
      padding: 15px 18px;
      color: var(--mongle) !important;
      caret-color: var(--mongle);
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #input::placeholder {
      color: var(--placeholder);
      opacity: 1;
    }

    #input:focus {
      border-color: var(--mongle) !important;
      box-shadow: 0 0 0 1px var(--mongle-faint), 0 0 18px rgba(0, 255, 65, 0.22);
    }

    .go-btn {
      background: var(--mongle) !important;
      color: #000 !important;
      border: none;
      border-radius: 8px;
      padding: 0 26px;
      font-family: "Share Tech Mono", "Courier New", monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
      cursor: pointer;
      transition: box-shadow 0.15s ease, transform 0.1s ease;
    }

    .go-btn:hover {
      box-shadow: 0 0 22px rgba(0, 255, 65, 0.65);
    }

    .go-btn:active {
      transform: scale(0.97);
    }

    .truncate {
      text-overflow: ellipsis;
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6840529569014734"
    crossorigin="anonymous"></script>
<base target="_blank">
</head>

<body>
  <div class="f-nav"></div>
  <div id="particles-js">
    <script rel="preload" src="https://cdn.jsdelivr.net/particles.js/2.0.0/"></script>
    <div class="main">
      <h1 class="title">MONGLE<span class="cursor">_</span>PROXY</h1>
      <p class="subtitle">v1.0 &mdash; Secure Tunnel Active</p>
      <p id="splash" hidden></p>
      <div class="search-container">
        <form id="fv" method="POST">
          <input id="input" class="truncate" placeholder="Enter URL... (e.g. https://google.com)" type="text"
            autocomplete="off" spellcheck="false" />
          <button class="go-btn" type="submit">GO</button>
        </form>
      </div>
    </div>
  </div>
  <script src="/assets/js/mg-pxy.js"></script>
  <script src="assets/js/index-3.js"></script>
  <script src="/assets/js/h1.js"></script>
  <script src="./assets/mathematics/bundle.js?v=2025-04-15"></script>
  <script src="./assets/mathematics/config.js?v=2025-04-15"></script>
  <script src="/assets/languagearts/sj.all.js?v=2025-04-15"></script>
  <script src="/assets/js/sj-tp.js?v=2025-04-15"></script>
  <script src="/assets/js/m1.js"></script>
  <!-- keep the terminal look locked: strip any theme/background the settings script applies -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
        if (link.href.includes("/assets/css/themes/")) link.remove()
      })
      document.body.style.backgroundImage = "none"
    }, { once: true })
  </script>

</body>

</html>
